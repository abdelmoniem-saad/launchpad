services:
  ollama:
    image: ollama/ollama:0.40.16
    # No host port: the app reaches Ollama on the compose network, so a local Ollama on 11434 never clashes.
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  model-pull:
    image: ollama/ollama:0.40.16
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["ollama", "pull", "${LOCAL_MODEL:-qwen3:8b}"]
    restart: "no"

  searxng:
    image: searxng/searxng:2026.11.17-b99cf7496
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/

  app:
    build: .
    depends_on:
      model-pull:
        condition: service_completed_successfully
      searxng:
        condition: service_started
    env_file:
      - path: .env
        required: false
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - LOCAL_MODEL=${LOCAL_MODEL:-qwen3:8b}
      - SEARXNG_URL=http://searxng:8080
    ports:
      - "8501:8501"
    volumes:
      - ./outputs:/app/outputs
      - ./data:/app/data
      - ./decision_log.json:/app/decision_log.json

volumes:
  ollama:
