# Use an Ollama already running on the host instead of the bundled ollama container.
#   docker compose -f docker-compose.yml -f compose.host-ollama.yml up --build app searxng
# Pull the model on the host first: ollama pull qwen3:8b
# On Linux the host Ollama must listen beyond 127.0.0.1 for the container to reach it
# (for example OLLAMA_HOST=0.0.0.0 in the Ollama service's environment).
services:
  app:
    depends_on: !override
      searxng:
        condition: service_started
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
